[project]
name = "prpop_repl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Alejandro Ouslan", email = "alejandro.ouslan@upr.edu" }]
requires-python = ">=3.13"
dependencies = [
    "arviz>=1.0.0",
    "bambi>=0.16.0",
    "censusforge>=0.6.1",
    "geopandas>=1.1.2",
    "jp-tools>=0.5.8",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "pymc>=5.28.0",
]

[project.scripts]
research-pr-population = "prpop_repl:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["jupyter>=1.1.1", "pre-commit>=4.5.1"]

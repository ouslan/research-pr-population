[project]
name = "prpop_repl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Alejandro Ouslan", email = "alejandro.ouslan@upr.edu" }]
requires-python = ">=3.12"
dependencies = [
    "arviz[all]>=0.23.4",
    "bambi>=0.17.2",
    "censusforge>=0.6.1",
    "geopandas>=1.1.2",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "pymc>=5.28.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[project.scripts]
research-pr-population = "prpop_repl:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.0",
    "pre-commit>=4.5.1",
]
